[project]
name = "lago-data-model"
version = "0.0.2"
description = ""
authors = [{ name = "Erick Diaz", email = "ewdiazsa@gmail.com" }]
package-mode = false
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "pandas>=2.1.0",
    "seaborn>=0.12.2",
    "jupyterlab>=4.0.0",
    "tqdm (>=4.67.1,<5.0.0)",
    "pyarrow (>=21.0.0,<22.0.0)",
    "tornado (>=6.5,<7.0)",
    "requests (>=2.32.4,<3.0.0)",
    "urllib3 (>=2.5.0,<3.0.0)",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0", 
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# TensorFlow + HLS4ML + Keras Tuner (búsqueda bayesiana)
# protobuf pineado: TF 2.17 espera 4.x; protobuf 5 rompe MessageFactory.GetPrototype.
[tool.poetry.group.tf.dependencies]
hls4ml = ">=0.8.0"
keras-tuner = ">=1.4.0"
protobuf = ">=4.21,<5"